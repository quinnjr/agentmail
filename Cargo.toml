[package]
name = "agentmail"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
cuid2 = "0.1"
futures-util = "0.3"
redb = "4.4"
rmcp = { version = "3.7", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["full"] }
ulid = { version = "3", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
