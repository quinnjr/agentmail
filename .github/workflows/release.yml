# Builds static Linux binaries for a version tag (vX.Y.Z) and publishes them
# as a GitHub release, in the layout install.sh downloads:
#   agentmail-<target>.tar.gz and agentmail-<target>.tar.gz.sha256
# Run it by hand (workflow_dispatch) to build the binaries without releasing.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          archive="agentmail-${{ matrix.target }}.tar.gz"
          mkdir dist pkg
          cp target/${{ matrix.target }}/release/agentmail README.md LICENSE-MIT LICENSE-APACHE pkg/
          tar -czf "dist/$archive" -C pkg agentmail README.md LICENSE-MIT LICENSE-APACHE
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          pkg/agentmail --version

      - uses: actions/upload-artifact@v4
        with:
          name: agentmail-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "agentmail $GITHUB_REF_NAME" \
            --generate-notes
