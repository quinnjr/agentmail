# Builds static Linux binaries for a version tag (vX.Y.Z) and publishes them
# as a GitHub release, in the layout install.sh downloads:
#   agentmail-<target>.tar.gz and agentmail-<target>.tar.gz.sha256
# Run it by hand (workflow_dispatch) to build the binaries without releasing.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'push'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          archive="agentmail-${{ matrix.target }}.tar.gz"
          mkdir dist pkg
          cp target/${{ matrix.target }}/release/agentmail README.md LICENSE-MIT LICENSE-APACHE pkg/
          tar -czf "dist/$archive" -C pkg agentmail README.md LICENSE-MIT LICENSE-APACHE
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          pkg/agentmail --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentmail-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v0.2.0-rc.1 is a prerelease, which releases/latest
          # (and so install.sh) skips.
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run after a partial failure: replace the assets, and
            # publish the release in case the failure left it a draft.
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false $pre
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "agentmail $GITHUB_REF_NAME" \
              --generate-notes $pre
          fi
